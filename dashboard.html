<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Student Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .dash-card {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            cursor: pointer;
            border-bottom: 5px solid var(--secondary-color);
        }
        .dash-card:hover {
            transform: translateY(-5px);
            background-color: var(--secondary-color);
            color: white;
        }
        .dash-card i {
            font-size: 40px;
            margin-bottom: 15px;
        }
        .dash-card h3 {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Portal</h2>
            <ul class="nav-links">
                <li><a href="dashboard.html">🏠 Dashboard</a></li>
                <li><a href="profile.html">👤 Profile</a></li>
                <li><a href="attendance.html">📅 Attendance</a></li>
                <li><a href="result.html">📊 Result</a></li>
                <li><a href="notice.html">🔔 Notices</a></li>
            </ul>
            <a href="#" id="logoutBtn" style="color: var(--accent-color); text-decoration: none; padding: 10px;">🚪 Logout</a>
        </aside>

        <main class="main-content">
            <header>
                <h1 id="welcomeUser">Welcome, Student!</h1>
                <button id="themeToggle" class="theme-toggle">🌙 Dark Mode</button>
            </header>

            <section class="dashboard-grid">
                <a href="profile.html" class="card dash-card">
                    <span style="font-size: 40px;">👤</span>
                    <h3>My Profile</h3>
                    <p>View personal details</p>
                </a>
                <a href="attendance.html" class="card dash-card">
                    <span style="font-size: 40px;">📅</span>
                    <h3>Attendance</h3>
                    <p>Check your presence</p>
                </a>
                <a href="result.html" class="card dash-card">
                    <span style="font-size: 40px;">📊</span>
                    <h3>Results</h3>
                    <p>View marks & GPA</p>
                </a>
                <a href="notice.html" class="card dash-card">
                    <span style="font-size: 40px;">🔔</span>
                    <h3>Notices</h3>
                    <p>Latest announcements</p>
                </a>
            </section>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
